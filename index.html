<!DOCTYPE html>
<html lang="pt-PT">
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha Infinito Pro - God Mode AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body, html {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050810;
            margin: 0; padding: 0;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, -50%, 0);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 12px;
            width: fit-content;
            margin: 0 auto;
        }

        @media (max-width: 450px) {
            .game-grid {
                grid-template-columns: repeat(3, 85px);
                grid-template-rows: repeat(3, 85px);
            }
        }

        .cell-btn {
            background: rgba(30, 41, 59, 0.4);
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            height: 100%;
            position: relative;
        }

        .cell-btn:hover:not(:disabled) {
            background: rgba(51, 65, 85, 0.6);
            transform: scale(1.05);
        }

        .symbol-appear {
            animation: appear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes appear {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .winning-cell {
            background: rgba(16, 185, 129, 0.25) !important;
            border-color: rgba(16, 185, 129, 0.6) !important;
            color: #10b981 !important;
            animation: win-glow 1s infinite alternate;
        }

        @keyframes win-glow {
            0% { box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
            100% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.5); transform: scale(1.03); }
        }

        .fade-warning::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(244, 63, 94, 0.1) 10px,
                rgba(244, 63, 94, 0.1) 20px
            );
            animation: pulse-warning 1s infinite linear;
            border-radius: 1.25rem;
            pointer-events: none;
        }

        @keyframes pulse-warning {
            0% { opacity: 0.2; }
            50% { opacity: 0.8; }
            100% { opacity: 0.2; }
        }

        .trophy-animate {
            animation: trophy-bounce 3s infinite ease-in-out;
        }

        @keyframes trophy-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px) rotate(5deg); }
        }
    </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Termo Clone</title>
  <style>
    :root{--bg:#1b1b1d;--line:#3a3a3c;--txt:#fff;--empty:#121213;--key:#818384;--ok:#3aa394;--mid:#d3ad69;--no:#3a3a3c}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}
    .app{width:min(540px,100%);padding:0 12px 16px}
    header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    h1{margin:0;font-size:1.95rem;letter-spacing:.08em}
    .btn{border:1px solid var(--line);background:transparent;color:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}
    #status{height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;margin:8px 0}
    #board{display:grid;gap:6px;margin:0 auto;width:min(350px,92vw)}
    .row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
    .tile{aspect-ratio:1/1;border:2px solid var(--line);display:grid;place-items:center;text-transform:uppercase;font-weight:700;font-size:2rem;background:var(--empty)}
    .tile.filled{border-color:#565758}.tile.ok{background:var(--ok);border-color:var(--ok)}.tile.mid{background:var(--mid);border-color:var(--mid)}.tile.no{background:var(--no);border-color:var(--no)}
    .pop{animation:pop .13s linear}.shake{animation:shake .35s linear}.flip{animation:flip .45s ease}
    @keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
    @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
    @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
    #kb{margin:16px auto 0;width:min(510px,96vw);display:grid;gap:8px}
    .krow{display:flex;gap:6px;justify-content:center}
    .k{height:58px;min-width:30px;flex:1;border:none;border-radius:4px;background:var(--key);color:#fff;font-weight:700;cursor:pointer}
    .k.w{flex:1.5;font-size:.72rem}.k.ok{background:var(--ok)}.k.mid{background:var(--mid)}.k.no{background:var(--no)}
  </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        const translations = {
            pt: {
                subtitle: "TIC TAC TOE - GOD MODE AI",
                scoreboard: "Placar",
                you: "VEZ DE \"X\"",
                ia: "VEZ DE \"O\"",
                aiState: "IA Imbatível",
                on: "ON",
                off: "OFF",
                speed: "Processamento IA",
                clearTable: "Limpar Mesa",
                resetPoints: "Zerar Pontos",
                supportTitle: " Apoiar Projeto",
                supportSubtitle: "Mantenha o jogo livre de anúncios!",
                contributeBtn: "APOIAR AGORA",
                contact: "Desenvolvedor",
                pixTitle: "Apoio via PIX",
                pixKeyLabel: "Chave E-mail",
                copyBtn: "Copiar Chave",
                copiedBtn: "Copiado!",
                thanksMsg: "Pequenas ajudas geram grandes códigos!",
                langBtn: "EN ",
                changeGame: "MUDAR DE JOGO"
            },
            en: {
                subtitle: "TIC TAC TOE - GOD MODE AI",
                scoreboard: "Scoreboard",
                you: "TURN OF \"X\"",
                ia: "TURN OF \"O\"",
                aiState: "God Mode AI",
                on: "ON",
                off: "OFF",
                speed: "AI Processing",
                clearTable: "Clear Board",
                resetPoints: "Reset Scores",
                supportTitle: " Support Project",
                supportSubtitle: "Keep the game ad-free!",
                contributeBtn: "SUPPORT NOW",
                contact: "Developer",
                pixTitle: "Support via PIX",
                pixKeyLabel: "Email Key",
                copyBtn: "Copy Key",
                copiedBtn: "Copied!",
                thanksMsg: "Small helps create great code!",
                langBtn: "PT ",
                changeGame: "CHANGE GAME"
            }
        };

        function App() {
            const getSavedData = (key, defaultValue) => {
                try {
                    const saved = localStorage.getItem(key);
                    return saved ? JSON.parse(saved) : defaultValue;
                } catch { return defaultValue; }
            };

            const [lang, setLang] = useState(() => getSavedData('tic-tac-toe-lang', 'pt'));
            const t = translations[lang];

            const [board, setBoard] = useState(Array(9).fill(null));
            const [xMoves, setXMoves] = useState([]);
            const [oMoves, setOMoves] = useState([]);
            const [isXNext, setIsXNext] = useState(true);
            const [roundWinner, setRoundWinner] = useState(null);
            const [scores, setScores] = useState(() => getSavedData('tic-tac-toe-scores', { X: 0, O: 0 }));
            const [aiConfig, setAiConfig] = useState(() => getSavedData('tic-tac-toe-ai', { enabled: true, speed: 400 }));
            const [isAiThinking, setIsAiThinking] = useState(false);
            const [showSupport, setShowSupport] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);

            useEffect(() => {
                localStorage.setItem('tic-tac-toe-scores', JSON.stringify(scores));
                localStorage.setItem('tic-tac-toe-ai', JSON.stringify(aiConfig));
                localStorage.setItem('tic-tac-toe-lang', JSON.stringify(lang));
            }, [scores, aiConfig, lang]);

            const checkWinner = useCallback((squares) => {
                const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                for (let i = 0; i < lines.length; i++) {
                    const [a, b, c] = lines[i];
                    if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
                        return { player: squares[a], line: [a, b, c] };
                    }
                }
                return null;
            }, []);

            const minimax = useCallback((currentBoard, currentXMoves, currentOMoves, depth, isMaxing, alpha, beta) => {
                const win = checkWinner(currentBoard);
                if (win?.player === 'O') return 100 - depth;
                if (win?.player === 'X') return depth - 100;
                if (depth >= 9) return 0;

                const available = [];
                for(let i=0; i<9; i++) if(currentBoard[i] === null) available.push(i);
                
                if (available.length === 0) return 0;

                if (isMaxing) {
                    let bestScore = -Infinity;
                    for (let i of available) {
                        let nextBoard = [...currentBoard];
                        let nextOMoves = [...currentOMoves];
                        if (nextOMoves.length === 3) {
                            const removedIdx = nextOMoves.shift();
                            nextBoard[removedIdx] = null;
                        }
                        nextBoard[i] = 'O';
                        nextOMoves.push(i);
                        let score = minimax(nextBoard, currentXMoves, nextOMoves, depth + 1, false, alpha, beta);
                        bestScore = Math.max(bestScore, score);
                        alpha = Math.max(alpha, bestScore);
                        if (beta <= alpha) break;
                    }
                    return bestScore;
                } else {
                    let bestScore = Infinity;
                    for (let i of available) {
                        let nextBoard = [...currentBoard];
                        let nextXMoves = [...currentXMoves];
                        if (nextXMoves.length === 3) {
                            const removedIdx = nextXMoves.shift();
                            nextBoard[removedIdx] = null;
                        }
                        nextBoard[i] = 'X';
                        nextXMoves.push(i);
                        let score = minimax(nextBoard, nextXMoves, currentOMoves, depth + 1, true, alpha, beta);
                        bestScore = Math.min(bestScore, score);
                        beta = Math.min(beta, bestScore);
                        if (beta <= alpha) break;
                    }
                    return bestScore;
                }
            }, [checkWinner]);

            const handlePlay = useCallback((i) => {
                if (board[i] || roundWinner) return;

                const symbol = isXNext ? 'X' : 'O';
                let nextBoard = [...board];
                let nextXMoves = [...xMoves];
                let nextOMoves = [...oMoves];

                if (isXNext) {
                    if (nextXMoves.length === 3) {
                        const oldIdx = nextXMoves.shift();
                        nextBoard[oldIdx] = null;
                    }
                    nextXMoves.push(i);
                } else {
                    if (nextOMoves.length === 3) {
                        const oldIdx = nextOMoves.shift();
                        nextBoard[oldIdx] = null;
                    }
                    nextOMoves.push(i);
                }

                nextBoard[i] = symbol;
                setBoard(nextBoard);
                setXMoves(nextXMoves);
                setOMoves(nextOMoves);

                const win = checkWinner(nextBoard);
                if (win) {
                    setRoundWinner(win);
                    setScores(s => ({ ...s, [win.player]: s[win.player] + 1 }));
                    setTimeout(() => resetTable(), 1500);
                } else {
                    setIsXNext(!isXNext);
                }
            }, [board, roundWinner, isXNext, xMoves, oMoves, checkWinner]);

            const resetTable = () => {
                setBoard(Array(9).fill(null));
                setXMoves([]);
                setOMoves([]);
                setRoundWinner(null);
                setIsXNext(true);
            };

            const resetScores = () => {
                resetTable();
                setScores({ X: 0, O: 0 });
            };

            useEffect(() => {
                if (aiConfig.enabled && !isXNext && !roundWinner && !isAiThinking) {
                    setIsAiThinking(true);
                    const timer = setTimeout(() => {
                        const available = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
                        if (available.length === 0) { setIsAiThinking(false); return; }
                        let bestMove;
                        let bestScore = -Infinity;
                        for (let i of available) {
                            let tempBoard = [...board];
                            let tempOMoves = [...oMoves];
                            if (tempOMoves.length === 3) {
                                const removedIdx = tempOMoves.shift();
                                tempBoard[removedIdx] = null;
                            }
                            tempBoard[i] = 'O';
                            tempOMoves.push(i);
                            let score = minimax(tempBoard, xMoves, tempOMoves, 0, false, -Infinity, Infinity);
                            if (i === 4) score += 0.1;
                            if ([0, 2, 6, 8].includes(i)) score += 0.05;
                            if (score > bestScore) {
                                bestScore = score;
                                bestMove = i;
                            }
                        }
                        if (bestMove !== undefined) handlePlay(bestMove);
                        setIsAiThinking(false);
                    }, aiConfig.speed);
                    return () => clearTimeout(timer);
                }
            }, [isXNext, aiConfig.enabled, roundWinner, board, minimax, aiConfig.speed, xMoves, oMoves, handlePlay]);

            const copyPix = () => {
                const pix = "contato.th047@gmail.com";
                const el = document.createElement('textarea');
                el.value = pix;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setCopySuccess(true);
                setTimeout(() => setCopySuccess(false), 2000);
            };

            const cells = useMemo(() => board.map((cell, i) => {
                const isWin = roundWinner?.line.includes(i);
                const isNextToFade = !roundWinner && (
                    (isXNext && xMoves[0] === i && xMoves.length === 3) || 
                    (!isXNext && oMoves[0] === i && oMoves.length === 3)
                );
                return (
                    <button 
                        key={i} 
                        onClick={() => handlePlay(i)} 
                        disabled={cell !== null || roundWinner || isAiThinking}
                        className={`cell-btn ${isWin ? 'winning-cell' : ''} ${isNextToFade ? 'fade-warning' : ''}`}
                    >
                        {cell && (
                            <span className={`symbol-appear ${cell === 'X' ? 'text-blue-400' : 'text-rose-400'} ${isNextToFade ? 'opacity-30 blur-[1px] scale-90' : 'opacity-100'} transition-all duration-500`}>
                                {cell}
                            </span>
                        )}
                    </button>
                );
            }), [board, roundWinner, isXNext, xMoves, oMoves, isAiThinking, handlePlay]);

            return (
                <div className="flex flex-col items-center justify-center min-h-screen py-8 px-4 space-y-8">
                    <div className="text-center space-y-2 pt-4">
                        <h1 className="text-5xl md:text-7xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-rose-400 to-emerald-500 uppercase tracking-normal leading-[1.2] drop-shadow-sm px-4">
                            Infinito
                        </h1>
                        <p className="text-[10px] uppercase tracking-[0.4em] text-slate-500 font-bold opacity-80">{t.subtitle}</p>
                    </div>

                    <div className="flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-6 w-full max-w-[1100px]">
                        <div className="w-full max-w-[324px] lg:w-72 flex flex-col gap-4">
                            <button onClick={() => setLang(l => l === 'pt' ? 'en' : 'pt')} className="w-full py-3 glass-panel hover:bg-white/5 text-[10px] font-black uppercase tracking-widest transition-all">
                                {t.langBtn}
                            </button>

                            <div className="glass-panel p-5 space-y-4 flex-1">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500 px-1 border-b border-white/5 pb-2">{t.scoreboard}</h3>
                                <div className="space-y-3">
                                    <div className={`p-4 rounded-2xl flex items-center justify-between transition-all duration-300 ${isXNext && !roundWinner ? 'bg-blue-500/10 border-blue-500/20 scale-105' : 'bg-white/5 opacity-40'}`}>
                                        <div className="flex flex-col">
                                            <span className="text-[10px] font-black text-blue-400 uppercase leading-tight">{t.you}</span>
                                            <span className="text-xl font-black text-blue-400">X</span>
                                        </div>
                                        <span className="text-3xl font-black">{scores.X}</span>
                                    </div>
                                    <div className={`p-4 rounded-2xl flex items-center justify-between transition-all duration-300 ${!isXNext && !roundWinner ? 'bg-rose-500/10 border-rose-500/20 scale-105' : 'bg-white/5 opacity-40'}`}>
                                        <div className="flex flex-col">
                                            <span className="text-[10px] font-black text-rose-400 uppercase leading-tight">{t.ia}</span>
                                            <span className="text-xl font-black text-rose-400">O</span>
                                        </div>
                                        <span className="text-3xl font-black">{scores.O}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="glass-panel p-5 space-y-4">
                                <div className="flex justify-between items-center">
                                    <span className="text-[10px] font-black uppercase text-slate-400">{t.aiState}</span>
                                    <button onClick={() => setAiConfig(c => ({...c, enabled: !c.enabled}))} className={`px-4 py-1.5 rounded-full text-[9px] font-bold uppercase transition-all ${aiConfig.enabled ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                        {aiConfig.enabled ? t.on : t.off}
                                    </button>
                                </div>
                                <div className="space-y-2">
                                    <div className="flex justify-between">
                                        <span className="text-[10px] uppercase font-bold text-slate-500">{t.speed}</span>
                                        <span className="text-[10px] font-mono font-bold text-blue-400">{aiConfig.speed}ms</span>
                                    </div>
                                    <input type="range" min="100" max="2000" step="100" value={aiConfig.speed} onChange={e => setAiConfig(c => ({...c, speed: parseInt(e.target.value)}))} className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none accent-blue-500 cursor-pointer" />
                                </div>
                            </div>
                        </div>

                        <div className="w-full max-w-[324px] md:max-w-none flex flex-col gap-4">
                            <div className="glass-panel p-6 shadow-2xl flex items-center justify-center flex-1">
                                <div className="game-grid">{cells}</div>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={resetScores} className="flex-1 py-4 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-2xl text-[10px] font-black uppercase transition-all border border-rose-500/10 active:scale-95">
                                    {t.resetPoints}
                                </button>
                                <button onClick={resetTable} className="flex-1 py-4 bg-slate-800/80 hover:bg-slate-700 rounded-2xl text-[10px] font-black uppercase transition-all border border-white/5 active:scale-95">
                                    {t.clearTable}
                                </button>
                            </div>
                        </div>

                        <div className="w-full max-w-[324px] lg:w-72 flex flex-col gap-4">
                            <div className="glass-panel p-6 bg-gradient-to-br from-amber-500/10 to-transparent border-amber-500/20 flex-1 flex flex-col justify-center text-center space-y-4">
                                <div className="text-amber-500 mx-auto trophy-animate">
                                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                                </div>
                                <h4 className="text-amber-400 text-xs font-black uppercase tracking-widest">{t.supportTitle}</h4>
                                <p className="text-[10px] text-slate-400">{t.supportSubtitle}</p>
                                <button onClick={() => setShowSupport(true)} className="w-full py-4 bg-amber-500 text-slate-950 font-black rounded-2xl text-[10px] uppercase shadow-lg transition-all active:scale-95">
                                    {t.contributeBtn}
                                </button>
                            </div>

                            <div className="glass-panel p-6 space-y-4">
                                <h4 className="text-blue-400 text-[10px] font-black uppercase tracking-widest border-b border-white/5 pb-2">{t.contact}</h4>
                                <div className="space-y-4">
                                    <a href="https://www.instagram.com/rafael.hpk" target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 group">
                                        <div className="p-2.5 bg-gradient-to-tr from-purple-600 to-rose-500 rounded-xl text-white shadow-lg transition-transform group-hover:scale-110 group-hover:rotate-12">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
                                        </div>
                                        <span className="text-[11px] font-bold text-slate-300 group-hover:text-white transition-colors">@rafael.hpk</span>
                                    </a>
                                    <div className="flex items-center gap-3 group">
                                        <div className="p-2.5 bg-slate-800 rounded-xl text-blue-400 border border-white/5">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/><rect width="20" height="16" x="2" y="4" rx="2"/></svg>
                                        </div>
                                        <span className="text-[10px] font-bold text-slate-400 truncate max-w-[140px]">contato.th047@gmail.com</span>
                                    </div>
                                </div>
                            </div>

                            <a href="https://thz047.github.io/ThGames2/" className="w-full py-4 glass-panel bg-blue-500/10 text-blue-400 text-[10px] font-black uppercase tracking-widest flex items-center justify-center gap-3 hover:bg-blue-500/20 active:scale-95">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="m9 18 6-6-6-6"/></svg>
                                {t.changeGame}
                            </a>
                        </div>
                    </div>

                    {showSupport && (
                        <div className="fixed inset-0 z-[9999] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setShowSupport(false)}>
                            <div className="glass-panel bg-[#0a0f1e] w-full max-w-sm p-8 text-center space-y-6 border border-amber-500/20" onClick={e => e.stopPropagation()}>
                                <h2 className="text-amber-400 font-black uppercase text-sm tracking-widest">{t.pixTitle}</h2>
                                <div className="p-4 bg-black/40 rounded-2xl border border-white/5 space-y-4">
                                    <span className="text-[11px] font-bold text-blue-400 break-all block">contato.th047@gmail.com</span>
                                    <button onClick={copyPix} className={`w-full py-3 rounded-xl text-[10px] font-black uppercase transition-all shadow-md active:scale-95 ${copySuccess ? 'bg-emerald-500' : 'bg-blue-600'}`}>
                                        {copySuccess ? t.copiedBtn : t.copyBtn}
                                    </button>
                                </div>
                                <p className="text-[11px] text-amber-200/80 font-bold leading-relaxed italic px-4">
                                    "{t.thanksMsg}"
                                </p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
  <div class="app">
    <header>
      <button class="btn" id="help">?</button>
      <h1>TERMO</h1>
      <button class="btn" id="restart">REINICIAR</button>
    </header>
    <div id="status"></div>
    <main id="board"></main>
    <section id="kb"></section>
  </div>

<script>
const WORDS=["TERMO","SAGAZ","AFETO","LIVRO","MUNDO","TEXTO","NOBRE","VIGOR","FELIZ","BRISA","FAROL","PRATO","NIVEL","SORTE","SONHO","FESTA","VALOR","CANTO"];
const VALID=new Set(WORDS);
const rows=6, cols=5;
let answer="", row=0, col=0, done=false;
let grid=Array.from({length:rows},()=>Array(cols).fill(""));
let evals=Array.from({length:rows},()=>Array(cols).fill(""));
let keyState={};
const board=document.getElementById('board'), kb=document.getElementById('kb'), status=document.getElementById('status');
const rank={no:1,mid:2,ok:3};

function msg(t){status.textContent=t}
function choose(){answer=WORDS[Math.floor(Math.random()*WORDS.length)]}
function build(){
  board.innerHTML='';board.style.gridTemplateRows=`repeat(${rows},1fr)`;
  for(let r=0;r<rows;r++){const rw=document.createElement('div');rw.className='row';
    for(let c=0;c<cols;c++){const t=document.createElement('div');t.className='tile';t.id=`t-${r}-${c}`;rw.appendChild(t)}board.appendChild(rw)}
  kb.innerHTML='';
  ["QWERTYUIOP","ASDFGHJKL","ENTERZXCVBNM⌫"].forEach(line=>{const rw=document.createElement('div');rw.className='krow';
    const keys=line==='ENTERZXCVBNM⌫'?["ENTER",..."ZXCVBNM","⌫"]:[...line];
    keys.forEach(k=>{const b=document.createElement('button');b.className='k'+((k==='ENTER'||k==='⌫')?' w':'');b.dataset.k=k;b.textContent=(k==='⌫'?'APAGAR':k);b.onclick=()=>input(k);rw.appendChild(b)});kb.appendChild(rw);
  });
}
function paint(){
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const t=document.getElementById(`t-${r}-${c}`);t.className='tile';t.textContent=grid[r][c];if(grid[r][c])t.classList.add('filled');if(evals[r][c])t.classList.add(evals[r][c])}
  document.querySelectorAll('.k').forEach(b=>{const k=b.dataset.k;if(k==='ENTER'||k==='⌫')return;b.classList.remove('ok','mid','no');if(keyState[k])b.classList.add(keyState[k])})
}
function score(word){
  const res=Array(cols).fill('no'); const a=[...answer], g=[...word];
  for(let i=0;i<cols;i++)if(g[i]===a[i]){res[i]='ok';a[i]=null;g[i]=null}
  for(let i=0;i<cols;i++)if(g[i]){const j=a.indexOf(g[i]);if(j>-1){res[i]='mid';a[j]=null}}
  return res;
}
function animateRow(r,cls){for(let c=0;c<cols;c++)document.getElementById(`t-${r}-${c}`).classList.add(cls)}
function input(k){
  if(done)return;
  if(k==='ENTER')return submit();
  if(k==='⌫'){if(col>0){col--;grid[row][col]='';paint()}return}
  if(/^[A-Z]$/.test(k)&&col<cols){grid[row][col]=k;paint();const t=document.getElementById(`t-${row}-${col}`);t.classList.add('pop');col++}
}
function submit(){
  if(col<cols){msg('Palavra incompleta');animateRow(row,'shake');return}
  const guess=grid[row].join('');
  if(!VALID.has(guess)){msg('Palavra não reconhecida');animateRow(row,'shake');return}
  const s=score(guess);evals[row]=s;
  for(let i=0;i<cols;i++){const ch=guess[i];keyState[ch]=!keyState[ch]?s[i]:(rank[s[i]]>rank[keyState[ch]]?s[i]:keyState[ch]);const t=document.getElementById(`t-${row}-${i}`);t.classList.add('flip')}
  paint();
  if(guess===answer){done=true;msg('GENIAL! Você acertou.');return}
  if(row===rows-1){done=true;msg(`Fim de jogo. Palavra: ${answer}`);return}
  row++;col=0;msg('');
}
function reset(){row=0;col=0;done=false;grid=Array.from({length:rows},()=>Array(cols).fill(""));evals=Array.from({length:rows},()=>Array(cols).fill(""));keyState={};choose();paint();msg('Descubra a palavra em 6 tentativas.')}

document.addEventListener('keydown',e=>{const k=e.key.toUpperCase();if(k==='BACKSPACE')input('⌫');else if(k==='ENTER')input('ENTER');else if(/^[A-Z]$/.test(k))input(k)});
document.getElementById('restart').onclick=reset;
document.getElementById('help').onclick=()=>alert('Acerte a palavra de 5 letras em 6 tentativas.\nVerde: letra certa no lugar certo.\nAmarelo: letra existe em outro lugar.\nCinza: letra não existe.');
build();reset();
</script>
</body>
</html>
